name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'release: ')"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'release: ')"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'release: ')"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test

  python-contracts:
    runs-on: ubuntu-22.04
    if: "!startsWith(github.event.head_commit.message, 'release: ')"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JOB_FINDER_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.9
          uv sync --frozen
      - name: Check Python
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run basedpyright --level error
          uv run vulture
          uv run xenon --max-absolute C --max-modules B --max-average A job_finder
          uv lock --check
          JOB_FINDER_POSTGRES_DSN="$JOB_FINDER_TEST_POSTGRES_DSN" uv run dagster definitions validate -m job_finder.dagster
          uv run pytest
          uv run pytest contracts
      - name: Build Dagster image
        run: docker build --tag job-finder-dagster:test .

  cloudflare:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'release: ')"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - run: bun install --frozen-lockfile
      - name: Validate Cloudflare Worker
        run: bun run check:cloudflare

  integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: "!startsWith(github.event.head_commit.message, 'release: ')"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - run: bun install --frozen-lockfile
      - name: Integration tests
        run: bun run test:integration
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
