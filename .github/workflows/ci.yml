name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JOB_FINDER_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JOB_FINDER_DAGSTER_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres?options=-csearch_path%3Ddagster
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.9
          uv sync --frozen
      - name: Create Dagster storage schema
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE SCHEMA IF NOT EXISTS dagster'
      - name: Check Python
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run basedpyright --outputjson > basedpyright-report.json || true
          python3 -c "
          import json
          report = json.load(open('basedpyright-report.json'))
          for d in report['generalDiagnostics']:
              print(d['severity'], d['file'], d['range']['start']['line'] + 1, d.get('message', '')[:300])
          if report['summary']['errorCount']:
              raise SystemExit(1)
          "
          uv run vulture
          uv run xenon --max-absolute C --max-modules B --max-average A job_finder
          uv lock --check
          JOB_FINDER_POSTGRES_DSN="$JOB_FINDER_TEST_POSTGRES_DSN" uv run dagster definitions validate -m job_finder.dagster
          uv run pytest
          uv run pytest contracts
      - name: Build application image
        run: docker build --tag job-finder-dagster:test .
      - name: Smoke test Compose deployment
        run: |
          cp .env.example .env
          export POSTGRES_PORT=5433
          export JOB_FINDER_REVIEW_SESSION_SECRET=ci-session-secret-with-at-least-32-characters
          export JOB_FINDER_BOOTSTRAP_TOKEN=ci-bootstrap-token-with-at-least-32-characters
          export JOB_FINDER_CREDENTIAL_ENCRYPTION_KEY=Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
          docker compose up --build --detach --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          curl --fail --silent --cookie-jar /tmp/job-finder-cookies \
            http://127.0.0.1:8080/setup --output /tmp/job-finder-setup.html
          grep --quiet 'Create the owner password' /tmp/job-finder-setup.html
          csrf_token=$(python3 -c "import re; print(re.search(r'name=\"csrf_token\" value=\"([^\"]+)\"', open('/tmp/job-finder-setup.html').read()).group(1))")
          curl --silent --show-error --cookie /tmp/job-finder-cookies \
            --cookie-jar /tmp/job-finder-cookies --dump-header /tmp/job-finder-setup.headers \
            --output /dev/null --data-urlencode "csrf_token=$csrf_token" \
            --data-urlencode "bootstrap_token=$JOB_FINDER_BOOTSTRAP_TOKEN" \
            --data-urlencode 'password=ci secure owner password' \
            --data-urlencode 'password_confirmation=ci secure owner password' \
            http://127.0.0.1:8080/setup
          grep --quiet '303' /tmp/job-finder-setup.headers
          docker compose exec -T postgres psql -U postgres -d job_finder -Atc \
            "SELECT password_hash FROM owner_onboarding WHERE singleton_id = 1" \
            | grep --quiet '^scrypt'
          docker compose restart review
          curl --retry 12 --retry-all-errors --retry-delay 2 --fail --silent \
            http://127.0.0.1:8080/readyz
          rm -f /tmp/job-finder-cookies
          curl --silent --show-error --cookie-jar /tmp/job-finder-cookies \
            --dump-header /tmp/job-finder-login.headers --output /dev/null \
            --data-urlencode 'password=ci secure owner password' \
            --data-urlencode 'next=/review' http://127.0.0.1:8080/login
          grep --quiet '303' /tmp/job-finder-login.headers
          curl --fail --silent --cookie /tmp/job-finder-cookies \
            http://127.0.0.1:8080/setup/providers | grep --quiet 'Connect the services'
      - name: Stop Compose deployment
        if: always()
        run: |
          if [ -f .env ]; then
            JOB_FINDER_REVIEW_SESSION_SECRET=ci-session-secret-with-at-least-32-characters \
              docker compose down --volumes
          fi
