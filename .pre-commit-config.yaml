repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python]
      - id: ruff-format
        types_or: [python]
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright type check
        entry: uv run basedpyright --level error
        language: system
        pass_filenames: false
      - id: vulture
        name: vulture dead code check
        entry: uv run vulture
        language: system
        pass_filenames: false
      - id: xenon
        name: xenon complexity gate
        entry: uv run xenon --max-absolute C --max-modules B --max-average A job_finder
        language: system
        pass_filenames: false
