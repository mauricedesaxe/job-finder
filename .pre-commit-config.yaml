# Local hooks run through uv so the repo needs no other toolchain.
# Install with: uv run pre-commit install --install-hooks -t pre-commit -t commit-msg
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright --level error
        language: system
        pass_filenames: false
      - id: unit-tests
        name: unit tests
        entry: uv run pytest
        language: system
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        entry: >-
          bash -c 'msg=$(head -1 "$1"); if ! echo "$msg" | grep -qE
          "^(feat|fix|refactor|chore|docs|test|style|perf|ci|build|revert)(\(.+\))?: .+|^(Merge|Revert) ";
          then echo "Commit message must follow conventional commits format:" >&2;
          echo "  <type>(<optional scope>): <description>" >&2;
          echo "  Types: feat, fix, refactor, chore, docs, test, style, perf, ci, build, revert" >&2;
          echo >&2; echo "Got: $msg" >&2; exit 1; fi'
        language: system
        args: ["--"]
        stages: [commit-msg]
