storage:
  postgres:
    postgres_url:
      # Dagster storage tables live in their own schema so they cannot collide
      # with the domain tables (both name a `jobs` table). The variable carries
      # the same DSN as JOB_FINDER_POSTGRES_DSN with `options=-csearch_path%3Ddagster`
      # appended, e.g. set on Railway as
      # `${{Postgres.DATABASE_URL}}?options=-csearch_path%3Ddagster`.
      env: JOB_FINDER_DAGSTER_POSTGRES_DSN
telemetry:
  enabled: false
concurrency:
  runs:
    max_concurrent_runs: 4
  pools:
    default_limit: 1
