<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily review wireframe — editable board</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tldraw/tldraw@3.15.6/tldraw.css">
<style>
  html, body, #app { height: 100%; margin: 0; }
  #hint {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 999;
    background: #20201d; color: #f4f0e8; padding: 8px 16px; border-radius: 999px;
    font: 13px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; opacity: 0.92; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hint">Drag anything, double-click text to edit. Happy with it? Tell me, or Menu → Save a copy.</div>
<script type="module">
import * as React from 'react'
import { createRoot } from 'react-dom/client'
import { Tldraw } from 'https://esm.sh/@tldraw/tldraw@3?external=react,react-dom'

const json = await fetch('./review-nav.tldr').then((r) => r.text())

function App() {
  return React.createElement(Tldraw, {
    onMount(editor) {
      let snapshot = null
      if (typeof editor.store.schema.migrateStoreSnapshot === 'function') {
        const records = JSON.parse(json).records
        const store = Object.fromEntries(records.map((r) => [r.id, r]))
        const migrated = editor.store.schema.migrateStoreSnapshot({
          store,
          schema: JSON.parse(json).schema,
        })
        if (migrated.type === 'error') {
          console.error('migration failed', migrated.reason)
          return
        }
        snapshot = { store: migrated.value, schema: editor.store.schema.serialize() }
      } else {
        console.error('no migration api')
        return
      }
      editor.loadSnapshot(snapshot)
      editor.clearHistory()
      editor.zoomToFit()
    },
  })
}

createRoot(document.getElementById('app')).render(React.createElement(App))
</script>
</body>
</html>
